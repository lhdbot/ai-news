name: Daily Update

# 本机模式(scripts/*.bat + Windows 计划任务)运行为主，数据只保存在本地、不再提交到仓库。
# 因此云端定时兜底已停用（它会产生 data 提交，与"数据不入库"策略冲突），仅保留手动触发。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch news and summarize
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skip commit."
          else
            git commit -m "data: daily news $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
