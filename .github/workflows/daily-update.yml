name: Daily Update

# 本机模式为主(scripts/local-update.bat + Windows 计划任务);
# 云端作为兜底: 每天 UTC 23:00(北京时间 07:00)定时抓取, 同时保留手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 23:00 = 北京时间 07:00
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch news and summarize
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/fetch-news.mjs

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skip commit."
          else
            git commit -m "data: daily news $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
